apiVersion: v1
kind: Namespace
metadata:
  name: chargeback-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chargeback-config
  namespace: chargeback-system
data:
  CHARGEBACK_ENV: "production"
  CHARGEBACK_RATE_LIMIT: "120"
  CHARGEBACK_REQUEST_TIMEOUT_SECONDS: "5.0"
  CHARGEBACK_AUDIT_DB_PATH: "/var/lib/chargeback/audit_log.db"
  CHARGEBACK_CORS_ORIGINS: "https://dashboard.internal.domain"
---
apiVersion: v1
kind: Secret
metadata:
  name: chargeback-secrets
  namespace: chargeback-system
type: Opaque
stringData:
  CHARGEBACK_API_KEYS: "prod_worker:live-worker-secret-key-prod-0001:decision,audit_scanner:ro-scanner-secret-key-prod-0002:readonly"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chargeback-engine
  namespace: chargeback-system
  labels:
    app.kubernetes.io/name: chargeback-risk-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chargeback-risk-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chargeback-risk-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: engine
          image: chargeback-risk-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: chargeback-config
            - secretRef:
                name: chargeback-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1024Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: audit-storage
              mountPath: /var/lib/chargeback
      volumes:
        - name: audit-storage
          persistentVolumeClaim:
            claimName: chargeback-audit-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: chargeback-service
  namespace: chargeback-system
  labels:
    app.kubernetes.io/name: chargeback-risk-engine
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: chargeback-risk-engine
