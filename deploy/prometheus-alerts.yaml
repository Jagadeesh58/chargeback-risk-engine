apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: chargeback-risk-engine-alerts
  namespace: chargeback-system
  labels:
    role: alert-rules
spec:
  groups:
    - name: chargeback-operational-alerts
      rules:
        - alert: HighDisputeErrorRate
          expr: (rate(chargeback_audit_writes_total{status="error"}[5m]) / rate(chargeback_decisions_total[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Elevated error rate on chargeback decisions"
            description: "Over 5% of chargeback decision requests resulted in errors during the last 5 minutes."

        - alert: AuditChainIntegrityFailure
          expr: chargeback_audit_writes_total{status="conflict"} > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Audit payload conflict or integrity warning"
            description: "A dispute ID submitted with a mutated payload was rejected with 409 conflict."

        - alert: RateLimitSaturation
          expr: rate(chargeback_rate_limit_exceeded_total[5m]) > 10
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Rate limiting threshold saturated"
            description: "High volume of requests are being throttled with HTTP 429."

        - alert: ElevatedHumanReviewRate
          expr: (sum(rate(chargeback_decisions_total{action="HUMAN-REVIEW"}[15m])) / sum(rate(chargeback_decisions_total[15m]))) > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Abnormal surge in manual human reviews"
            description: "More than 85% of decisions are being diverted to human review over the past 15 minutes."

        - alert: DecisionLatencyP95High
          expr: histogram_quantile(0.95, sum(rate(chargeback_decision_duration_seconds_bucket[5m])) by (le)) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Decision latency P95 exceeds SLA threshold"
            description: "P95 decision latency has exceeded 50ms for more than 5 minutes."
