# Prometheus Alerting Rules for Chargeback Risk Engine
groups:
  - name: chargeback-operational-alerts
    rules:
      - alert: HighDisputeErrorRate
        expr: (rate(chargeback_audit_writes_total{status="error"}[5m]) / rate(chargeback_decisions_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Elevated error rate on chargeback decisions"
          description: "Over 5% of chargeback decision requests resulted in errors during the last 5 minutes."

      - alert: AuditWriteFailures
        expr: increase(chargeback_audit_writes_total{status="error"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SQLite audit trail write failures detected"
          description: "One or more append operations to the SQLite audit log failed."

      - alert: AuditChainConflict
        expr: increase(chargeback_audit_writes_total{status="conflict"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Audit payload conflict detected"
          description: "A dispute submitted with an existing dispute_id had mutated parameters (HTTP 409)."

      - alert: RateLimitSaturation
        expr: rate(chargeback_rate_limit_exceeded_total[5m]) > 10
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Rate limiting threshold saturated"
          description: "Clients are experiencing throttling due to exceeded rate limits (HTTP 429)."

      - alert: ElevatedHumanReviewRate
        expr: (sum(rate(chargeback_decisions_total{action="HUMAN-REVIEW"}[15m])) / sum(rate(chargeback_decisions_total[15m]))) > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Abnormal surge in manual human reviews"
          description: "Over 85% of decisions are being routed to human review over the past 15 minutes."

      - alert: DecisionLatencyP95High
        expr: histogram_quantile(0.95, sum(rate(chargeback_decision_duration_seconds_bucket[5m])) by (le)) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 decision latency exceeded 50ms"
          description: "P95 decision pipeline execution latency is above 50ms for more than 5 minutes."
