[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chargeback-risk-engine"
version = "1.0.0"
description = "AI-assisted, evidence-aware chargeback risk and decision engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.30.0,<2.0.0",
  "pandas>=2.0.0,<3.0.0",
  "altair>=5.0.0,<7.0.0",
  "fastapi>=0.100.0,<1.0.0",
  "uvicorn>=0.20.0,<1.0.0",
  "pydantic>=2.0.0,<3.0.0",
  "scikit-learn>=1.3.0,<2.0.0",
  "pytest>=8.0.0,<9.0.0",
  "httpx>=0.25.0,<1.0.0",
  "requests>=2.28.0,<3.0.0",
  "numpy>=1.24.0,<3.0.0",
  "matplotlib>=3.7.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.1.0",
  "pip-audit>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chargeback_risk_engine*", "training*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
  "E501",  # line length handled by black/formatter
  "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[project.scripts]
chargeback-demo = "scripts.demo:main"


