[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chargeback-risk-engine"
version = "1.0.0"
description = "AI-assisted, evidence-aware chargeback risk and decision engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100.0,<1.0.0",
  "uvicorn>=0.20.0,<1.0.0",
  "pydantic>=2.0.0,<3.0.0",
  "pydantic-settings>=2.0.0,<3.0.0",
  "scikit-learn>=1.3.0,<2.0.0",
  "numpy>=1.24.0,<3.0.0",
  "pandas>=2.0.0,<3.0.0",
  "prometheus-client>=0.17.0,<1.0.0",
]

[project.optional-dependencies]
reports = [
  "matplotlib>=3.7.0,<4.0.0",
]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-cov>=4.1.0,<8.0.0",
  "hypothesis>=6.90.0,<7.0.0",
  "httpx>=0.25.0,<1.0.0",
  "ruff>=0.1.0",
  "mypy>=1.7.0",
  "pip-audit>=2.6.0",
  "build>=1.0.0",
  "twine>=4.0.0",
  "cyclonedx-bom>=3.11.0",
  "types-requests>=2.28.0",
  "matplotlib>=3.7.0,<4.0.0",
]
all = [
  "chargeback-risk-engine[reports,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chargeback_risk_engine*", "training*", "scripts*"]

[tool.setuptools.package-data]
chargeback_risk_engine = ["py.typed", "*.json", "*.sha256"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
  "E501",  # line length handled by black/formatter
  "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
  "B905",  # zip() without explicit strict= parameter
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "E701", "E702"]
"training/*" = ["E402"]
"tests/*" = ["E402", "B011", "B007", "B023", "F841", "W293"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true

[project.scripts]
chargeback-cli = "chargeback_risk_engine.cli:main"
chargeback-demo = "scripts.demo:main"
