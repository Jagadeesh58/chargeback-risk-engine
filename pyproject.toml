[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chargeback-risk-engine"
version = "1.0.0"
description = "AI-assisted, evidence-aware chargeback risk and decision engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit", "pandas", "altair", "fastapi", "uvicorn", "pydantic",
  "scikit-learn", "pytest", "httpx", "requests", "numpy"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chargeback_risk_engine*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
chargeback-demo = "scripts.demo:main"
