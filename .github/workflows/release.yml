name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build tools and cyclonedx
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build twine cyclonedx-bom
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify distribution archives
        run: twine check dist/*
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py requirements requirements.txt -o dist/sbom.cyclonedx.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            dist/sbom.cyclonedx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
