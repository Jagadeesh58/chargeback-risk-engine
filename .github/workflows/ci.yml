name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-cov pip-audit build twine cyclonedx-bom
      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck with mypy
        run: mypy chargeback_risk_engine
      - name: Test with pytest and coverage
        run: pytest --cov=chargeback_risk_engine --cov-report=term-missing
      - name: Run verification workflow
        run: make verify
      - name: Security audit with pip-audit
        run: pip-audit || echo "::warning::pip-audit completed with warnings"
      - name: Build package
        run: python -m build
      - name: Check package metadata with twine
        run: twine check dist/*
