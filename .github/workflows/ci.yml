name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck with mypy
        run: mypy chargeback_risk_engine
      - name: Test with pytest and coverage
        run: pytest --cov=chargeback_risk_engine --cov-report=term-missing
      - name: Run verification workflow
        run: make verify
      - name: Security audit with pip-audit
        run: pip-audit || echo "::warning::pip-audit completed with warnings"
      - name: Build package
        run: python -m build
      - name: Check package metadata with twine
        run: twine check dist/*

  wheel-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel and test clean install
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install dist/*.whl
          /tmp/clean-venv/bin/python -c "import chargeback_risk_engine.api; print('Core import OK')"
          /tmp/clean-venv/bin/uvicorn chargeback_risk_engine.api:app --port 8000 &
          API_PID=$!
          sleep 2
          curl -f http://127.0.0.1:8000/healthz || (kill $API_PID && exit 1)
          kill $API_PID

