name: verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Verify documentation and artifact drift
        run: |
          python scripts/generate_report.py
          git diff --exit-code artifacts docs
      - name: Run release verification
        run: python scripts/verify_release.py
