name: verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pip-audit
      - name: Lint with ruff
        run: ruff check .
      - name: Security audit with pip-audit
        run: pip-audit || echo "::warning::pip-audit found potential vulnerabilities"
      - name: Run verification workflow
        run: make verify
      - name: Verify documentation and artifact drift
        run: |
          python scripts/generate_report.py
          git diff --exit-code -- artifacts docs ':!docs/*.png'
      - name: Run release verification
        run: python scripts/verify_release.py
